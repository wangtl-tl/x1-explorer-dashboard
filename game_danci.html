<script>
// 错误自曝器：任何崩溃直接显示在嘎嘎对话框，方便截图报修
window.onerror=function(msg,src,line,col){
  try{
    var t="⚠️ 出错了："+msg+"（第"+line+"行）";
    var d=document.getElementById('duckSay'); if(d) d.textContent=t;
    var g=document.getElementById('gem'); if(g) g.parentNode.innerHTML=t;
  }catch(e){}
};
// 安全存储：预览窗口/隐私模式下localStorage被禁也不崩
const LS=(()=>{try{window.localStorage.setItem("__t","1");window.localStorage.removeItem("__t");return window.localStorage;}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}})();
const WORDS = [
  {en:"classroom",cn:"教室",cat:"学校"},{en:"window",cn:"窗户",cat:"学校"},{en:"light",cn:"灯",cat:"学校"},
  {en:"picture",cn:"图画",cat:"学校"},{en:"door",cn:"门",cat:"学校"},{en:"computer",cn:"计算机",cat:"学校"},
  {en:"schoolbag",cn:"书包",cat:"文具"},{en:"notebook",cn:"笔记本",cat:"文具"},{en:"candy",cn:"糖果",cat:"物品"},
  {en:"toy",cn:"玩具",cat:"物品"},{en:"key",cn:"钥匙",cat:"物品"},{en:"friend",cn:"朋友",cat:"人物"},
  {en:"strong",cn:"强壮的",cat:"人物"},{en:"quiet",cn:"安静的",cat:"人物"},{en:"glasses",cn:"眼镜",cat:"人物"},
  {en:"bedroom",cn:"卧室",cat:"家居"},{en:"bathroom",cn:"浴室",cat:"家居"},{en:"living room",cn:"客厅",cat:"家居"},
  {en:"kitchen",cn:"厨房",cat:"家居"},{en:"study",cn:"书房",cat:"家居"},{en:"fridge",cn:"冰箱",cat:"家居"},
  {en:"sofa",cn:"沙发",cat:"家居"},{en:"beef",cn:"牛肉",cat:"食物"},{en:"chicken",cn:"鸡肉",cat:"食物"},
  {en:"noodles",cn:"面条",cat:"食物"},{en:"soup",cn:"汤",cat:"食物"},{en:"vegetable",cn:"蔬菜",cat:"食物"},
  {en:"chopsticks",cn:"筷子",cat:"食物"},{en:"bowl",cn:"碗",cat:"食物"},{en:"spoon",cn:"勺子",cat:"食物"},
  {en:"doctor",cn:"医生",cat:"职业"},{en:"farmer",cn:"农民",cat:"职业"},{en:"driver",cn:"司机",cat:"职业"},
  {en:"nurse",cn:"护士",cat:"职业"},{en:"people",cn:"人们",cat:"职业"},{en:"baby brother",cn:"婴儿小弟弟",cat:"人物"}
];
const HINTS={classroom:"class+room",schoolbag:"school+bag",notebook:"note+book",bedroom:"bed+room",
  bathroom:"bath+room",chopsticks:"chop+sticks",vegetable:"ve-ge-ta-ble"};
const SKINS=[{name:"小帆船",face:"⛵",need:0},{name:"远洋巨轮",face:"🚢",need:30},{name:"黄金舰队",face:"🛳️",need:80}];
let deck,qi,gem,lock,curWord,typed,items,doubleArmed,bossTimer,bossLeft;
let stats=load("x1_stats_danci",{});
let totalGems=+(LS.getItem("x1_total_gems")||0);
let skinSel=+(LS.getItem("x1_skin_danci")||0);
let mistakes=JSON.parse(LS.getItem("x1_game_mistakes")||'{"shishang":[],"cuozi":[],"danci":[]}');

function load(k,d){ try{ return JSON.parse(LS.getItem(k))||d; }catch(e){ return d; } }
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }
function saveStats(){ LS.setItem("x1_stats_danci",JSON.stringify(stats)); }
function saveMistakes(){ LS.setItem("x1_game_mistakes",JSON.stringify(mistakes)); }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800); }

function renderSkins(){
  const line=document.getElementById('skinLine'); line.innerHTML='';
  SKINS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='skin'+(i===skinSel?' sel':'')+(totalGems<s.need?' lock':'');
    d.innerHTML='<div>'+s.face+'</div><div class="skinname">'+(totalGems<s.need?'🔒'+s.need:'')+'</div>';
    d.onclick=()=>{ if(totalGems<s.need){ toast("还差 "+(s.need-totalGems)+" 颗宝石解锁 "+s.name); return; }
      skinSel=i; LS.setItem("x1_skin_danci",i); renderSkins(); applySkin(); toast("换上【"+s.name+"】！出发！"); };
    line.appendChild(d);
  });
}
function applySkin(){
  document.getElementById('shipFace').textContent=SKINS[skinSel].face;
  document.getElementById('startFace').textContent=SKINS[skinSel].face+"🫧🦆";
}

async function fetchCustom(){
  try{
    const r=await fetch("data.json?t="+Date.now());
    if(!r.ok) return [];
    const d=await r.json();
    return ((d.game_custom&&d.game_custom.danci)||[]).filter(q=>q&&q.en&&q.cn).map(q=>({...q,cat:q.cat||"特训",custom:true}));
  }catch(e){ return []; }
}

function startGame(){
  qi=0; gem=0; lock=false; items={shield:1,double:0,hint:1}; doubleArmed=false;
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameCard').style.display='block';
  document.getElementById('mistBox').style.display='none';
  renderItemBar(); updateHUD();
  const revenge=(mistakes.danci||[]).map(w=>WORDS.find(x=>x.en===w)).filter(Boolean).slice(0,3);
  const picks=shuffle(WORDS).slice(0,5);
  const spellPool=WORDS.filter(w=>!w.en.includes(" "));
  const spells=shuffle(spellPool).slice(0,5);
  // 前5=认一认(含复仇)，后5=拼一拼(复仇词优先)——先开局，特训题后台异步混入
  let pickDeck=[...revenge.slice(0,2).map(w=>({...w,mode:"pick",revenge:true}))];
  pickDeck=pickDeck.concat(picks.filter(p=>!pickDeck.some(x=>x.en===p.en)).map(w=>({...w,mode:"pick"}))).slice(0,5);
  let spellDeck=spells.map(w=>({...w,mode:"spell"}));
  spellDeck=spellDeck.map(s=> revenge.some(r=>r.en===s.en)?{...s,revenge:true}:s);
  deck=shuffle(pickDeck).concat(spellDeck);
  nextQ();
  say("嘎！远航开始！"+(revenge.length?"注意，复仇词混进来了！":"盯紧行动，捞起单词气泡！"));
  // 特训气泡：不阻塞开局，加载到后插入尚未作答的"认一认"槽位
  fetchCustom().then(cs=>{
    if(!cs.length||lock===undefined) return;
    let j=qi+1, added=0;
    for(const c of cs){
      while(j<deck.length&&deck[j].mode!=="pick") j++;
      if(j>=deck.length) break;
      deck[j]={...c,mode:"pick",custom:true}; j++; added++;
    }
    if(added) say("⭐ X1特训气泡混进来了"+added+"个，捞到有惊喜！");
  }).catch(()=>{});
}
function updateHUD(){
  document.getElementById('gem').textContent=gem;
  document.getElementById('prog').textContent=qi;
}
function statHit(w,ok){
  const c=w.cat||"其他";
  if(!stats[c]) stats[c]=[0,0];
  stats[c][1]++; if(ok) stats[c][0]++;
  saveStats();
}
function missWord(w){
  mistakes.danci=(mistakes.danci||[]).filter(x=>x!==w.en);
  mistakes.danci.push(w.en); mistakes.danci=mistakes.danci.slice(-12); saveMistakes();
}
function nextQ(){
  if(qi>=10){ endGame(); return; }
  lock=false; renderItemBar();
  const item=deck[qi];
  const isBoss=(qi===9);
  const tag=document.getElementById('qTag');
  tag.className='qtag'+(isBoss?' boss':'');
  tag.textContent="🫧 打捞任务 "+(qi+1)+" · "+(item.mode==="pick"?"认一认":"拼一拼")+(item.revenge?" · 🔁复仇":"")+(item.custom?" · ⭐特训":"")+(isBoss?" · 👹限时20秒":"");
  if(item.mode==="pick"){
    document.getElementById('pickArea').style.display='block';
    document.getElementById('spellArea').style.display='none';
    document.getElementById('bigWord').textContent=item.en;
    const wrongs=shuffle(WORDS.filter(w=>w.cn!==item.cn)).slice(0,3).map(w=>w.cn);
    const opts=shuffle([item.cn,...wrongs]);
    const box=document.getElementById('opts'); box.innerHTML='';
    opts.forEach(v=>{
      const d=document.createElement('div'); d.className='opt'; d.textContent=v;
      d.onclick=()=>answerPick(d,v,item,isBoss); box.appendChild(d);
    });
  } else {
    curWord=item; typed=[];
    document.getElementById('pickArea').style.display='none';
    document.getElementById('spellArea').style.display='block';
    document.getElementById('bigCn').textContent=item.cn;
    document.getElementById('spellSub').textContent="点字母把单词拼出来！"+(isBoss?"限时20秒，答对+3！":"");
    buildSpell(item.en);
    clearInterval(bossTimer);
    if(isBoss){
      bossLeft=20;
      bossTimer=setInterval(()=>{
        bossLeft--;
        if(bossLeft<=0){ clearInterval(bossTimer); if(!lock){ lock=true; bossFail(); } }
      },1000);
    }
  }
  updateHUD();
}
function answerPick(el,v,w,isBoss){
  if(lock) return; lock=true; statHit(w,v===w.cn);
  if(v===w.cn){
    el.classList.add('correct');
    let gain=(isBoss?3:1); const dbl=doubleArmed; if(doubleArmed){ gain*=2; doubleArmed=false; }
    gem+=gain; updateHUD();
    if(window.XP3)XP3.hit('danci',w.cat,isBoss);
    // 复仇成功：答对就把这个词移出复仇名单
    mistakes.danci=(mistakes.danci||[]).filter(x=>x!==w.en); saveMistakes();
    if((qi+1)%3===0) grantItem();
    say("咕噜咕噜——气泡捞上来啦！"+w.en+" = 【"+w.cn+"】"+(isBoss?" 章鱼王被击退！":"")+(dbl?" ✖️2翻倍到账！":""));
    setTimeout(()=>{ qi++; nextQ(); },isBoss?1600:1200);
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(e=>{ if(e.textContent===w.cn) e.classList.add('correct'); });
    if(items.shield>0){ items.shield--; renderItemBar(); toast("🛡️ 护盾生效，本轮不计入复仇！"); }
    else { if(window.XP3)XP3.miss('danci',w.cat); missWord(w); }
    say("嘎…"+w.en+" 是【"+w.cn+"】哦，记住它！它已进复仇名单～");
    setTimeout(()=>{ qi++; nextQ(); },2000);
  }
}
function buildSpell(word){
  const clean=word.replace(/\s/g,'');
  let letters=clean.split('');
  const extra="abcdefghilmnoprstuw".split('');
  while(letters.length<clean.length+2){
    const c=extra[Math.floor(Math.random()*extra.length)];
    if(letters.filter(x=>x===c).length<clean.split('').filter(x=>x===c).length+1) letters.push(c);
  }
  letters=shuffle(letters);
  const slots=document.getElementById('slots'), box=document.getElementById('letters');
  slots.innerHTML=''; box.innerHTML='';
  word.split('').forEach(ch=>{
    const s=document.createElement('div'); s.className='slot';
    if(ch===' '){ s.style.border='none'; s.innerHTML='&nbsp;'; s.dataset.space='1'; }
    slots.appendChild(s);
  });
  letters.forEach(c=>{
    const b=document.createElement('button'); b.className='lt'; b.textContent=c;
    b.onclick=()=>tapLetter(b,c); box.appendChild(b);
  });
}
function tapLetter(btn,c){
  if(lock) return;
  const slots=[...document.querySelectorAll('.slot')];
  const s=slots.find(x=>!x.dataset.space&&!x.classList.contains('filled'));
  if(!s) return;
  s.textContent=c; s.classList.add('filled'); s.dataset.char=c;
  btn.classList.add('used');
  typed.push({btn,s});
  checkSpell();
}
function undoLetter(){
  const last=typed.pop(); if(!last) return;
  last.s.textContent=''; last.s.classList.remove('filled'); delete last.s.dataset.char;
  last.btn.classList.remove('used');
}
function revealWord(){
  if(lock) return; lock=true; clearInterval(bossTimer);
  statHit(curWord,false); if(window.XP3)XP3.miss('danci',curWord.cat); missWord(curWord);
  document.getElementById('duckSay').textContent="嘎嘎，看好啦："+curWord.en+"（"+curWord.cn+"），跟我读三遍！";
  const slots=[...document.querySelectorAll('.slot')].filter(x=>!x.dataset.space);
  const letters=[...curWord.en.replace(/\s/g,'')];
  slots.forEach((s,i)=>{ s.textContent=letters[i]; s.classList.add('filled'); });
  document.querySelectorAll('.lt').forEach(b=>b.classList.add('used'));
  setTimeout(()=>{ qi++; nextQ(); },2200);
}
function bossFail(){
  statHit(curWord,false); if(window.XP3)XP3.miss('danci',curWord.cat); missWord(curWord);
  toast("👹 章鱼王逃走了！正确拼写："+curWord.en);
  document.getElementById('duckSay').textContent="⏰ 超时！"+curWord.en+"（"+curWord.cn+"）已进复仇名单！";
  const slots=[...document.querySelectorAll('.slot')].filter(x=>!x.dataset.space);
  const letters=[...curWord.en.replace(/\s/g,'')];
  slots.forEach((s,i)=>{ s.textContent=letters[i]; s.classList.add('filled'); });
  document.querySelectorAll('.lt').forEach(b=>b.classList.add('used'));
  setTimeout(()=>{ qi++; nextQ(); },2200);
}
function checkSpell(){
  const slots=[...document.querySelectorAll('.slot')].filter(x=>!x.dataset.space);
  if(slots.some(s=>!s.classList.contains('filled'))) return;
  const got=slots.map(s=>s.dataset.char).join('');
  const want=curWord.en.replace(/\s/g,'');
  if(got.toLowerCase()===want.toLowerCase()){
    lock=true; clearInterval(bossTimer);
    statHit(curWord,true);
    if(window.XP3)XP3.hit('danci',curWord.cat,qi===9);
    mistakes.danci=(mistakes.danci||[]).filter(x=>x!==curWord.en); saveMistakes();
    let gain=2; const dbl=doubleArmed; if(doubleArmed){ gain*=2; doubleArmed=false; }
    gem+=gain; updateHUD();
    say("叮叮叮——拼写完美！【"+curWord.en+"】+"+gain+"气泡！"+(HINTS[curWord.en.replace(/\s/g,'')]?"小窍门："+HINTS[curWord.en.replace(/\s/g,'')]:"")+(dbl?" ✖️2翻倍到账！":""));
    setTimeout(()=>{ qi++; nextQ(); },1600);
  } else {
    lock=true; clearInterval(bossTimer);
    const usedShield = items.shield>0;
    if(usedShield){ items.shield--; } else { statHit(curWord,false); if(window.XP3)XP3.miss('danci',curWord.cat); missWord(curWord); }
    renderItemBar();
    slots.forEach(s=>{ s.style.color = usedShield ? '#e8a020' : '#e05555'; });
    setTimeout(()=>{
      // 统一全量重置：槽位清空 + 所有字母按钮解锁，杜绝卡死
      slots.forEach(s=>{ s.textContent=''; s.classList.remove('filled','hint'); s.style.color=''; delete s.dataset.char; });
      document.querySelectorAll('.lt').forEach(b=>{ b.classList.remove('used'); });
      typed=[];
      lock=false;
      if(usedShield) toast("🛡️ 护盾生效：字母已重排，不扣宝石、不记错题！");
    },800);
    if(usedShield){
      say("嘎！有字母站错位置啦！护盾帮你全部重排好了，再拼一次，稳稳的！");
    } else {
      say("嘎…顺序不对哦！"+curWord.cn+" 的单词是 "+want.length+" 个字母，它进复仇名单啦！");
    }
    updateHUD();
  }
}
function grantItem(){
  const it=Math.random()<0.5?"hint":"double";
  items[it]=(items[it]||0)+1; renderItemBar();
  toast("🎁 打捞奖励："+(it==="hint"?"首字母提示🔍":"双倍宝石✖️2"));
}
function renderItemBar(){
  const bar=document.getElementById('itemBar'); bar.innerHTML='';
  const defs=[["shield","🛡️ 护盾×"+(items.shield||0),"出错自动修正"],
              ["double","✖️2 双倍宝石×"+(items.double||0),"下一题翻倍"],
              ["hint","🔍 首字母提示×"+(items.hint||0),"点亮第一个字母"]];
  defs.forEach(([k,label,tip])=>{
    const d=document.createElement('div');
    const have=(items[k]||0)>0;
    d.className='item'+(!have?' none':'')+(doubleArmed&&k==='double'?' ':'');
    d.textContent=label; d.title=tip;
    d.onclick=()=>{
      if(lock) return;
      if(k==='double'){ if(doubleArmed) return; doubleArmed=true; items.double--; toast("✖️2已激活！"); }
      if(k==='hint'){
        if(curWord&&deck[qi]&&deck[qi].mode==='spell'){
          items.hint--;
          const slots=[...document.querySelectorAll('.slot')].filter(x=>!x.dataset.space);
          const first=slots.find(s=>!s.classList.contains('filled'));
          if(first){ first.textContent=curWord.en.replace(/\s/g,'')[0]; first.classList.add('filled','hint'); first.dataset.char=curWord.en.replace(/\s/g,'')[0]; toast("首字母已点亮！"); checkSpell(); }
        }
      }
      renderItemBar();
    };
    bar.appendChild(d);
  });
}
function say(t){ document.getElementById('duckSay').textContent=t; }

function endGame(){
  clearInterval(bossTimer);
  document.getElementById('gameCard').style.display='none';
  const s=document.getElementById('endScreen'); s.classList.add('active');
  totalGems+=gem; LS.setItem("x1_total_gems",totalGems);
  if(gem>=12){ document.getElementById('endFace').textContent="🏆"; document.getElementById('endTitle').textContent="满载而归！"; }
  else if(gem>=7){ document.getElementById('endFace').textContent="🎉"; document.getElementById('endTitle').textContent="收获满满！"; }
  else { document.getElementById('endFace').textContent="💪"; document.getElementById('endTitle').textContent="继续练习！"; }
  document.getElementById('endDesc').innerHTML="本轮捞到：<b>"+gem+"</b> 个气泡 🫧 ｜ 累计 "+totalGems+" 宝石";
  const r=document.getElementById('radar');
  const rows=Object.entries(stats).filter(([k,v])=>v[1]>0);
  r.innerHTML='<b style="font-size:13px">📊 打捞图谱（累计）</b>'+(rows.length?rows.map(([n,v])=>{
    const p=Math.round(v[0]/v[1]*100);
    return '<div class="row"><span style="width:64px">'+n+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span>'+v[0]+'/'+v[1]+'</span></div>';
  }).join(""):'');
  renderSkins(); applySkin();
  if(window.XP3)XP3.settle({game:'danci',name:'单词打捞队',gems:gem});
}
function exportMistakes(){
  const m=mistakes.danci||[];
  const target=document.getElementById('mistBox2')||document.getElementById('mistBox');
  if(!m.length){ target.textContent="复仇名单空空如也，全对！嘎嘎佩服！"; target.style.display='block'; return; }
  const text="【错词复仇名单】\n"+m.join(", ");
  target.textContent=text+"\n（长按复制或截图发群里给X1）";
  target.style.display='block';
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast("已复制！")).catch(()=>{}); }
}
renderSkins(); applySkin();
</script>
