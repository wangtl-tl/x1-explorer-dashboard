<script>
const WORDS = [
  {en:"classroom",cn:"教室"},{en:"window",cn:"窗户"},{en:"light",cn:"灯"},
  {en:"picture",cn:"图画"},{en:"door",cn:"门"},{en:"computer",cn:"计算机"},
  {en:"schoolbag",cn:"书包"},{en:"notebook",cn:"笔记本"},{en:"candy",cn:"糖果"},
  {en:"toy",cn:"玩具"},{en:"key",cn:"钥匙"},{en:"friend",cn:"朋友"},
  {en:"strong",cn:"强壮的"},{en:"quiet",cn:"安静的"},{en:"glasses",cn:"眼镜"},
  {en:"bedroom",cn:"卧室"},{en:"bathroom",cn:"浴室"},{en:"living room",cn:"客厅"},
  {en:"kitchen",cn:"厨房"},{en:"study",cn:"书房"},{en:"fridge",cn:"冰箱"},
  {en:"sofa",cn:"沙发"},{en:"beef",cn:"牛肉"},{en:"chicken",cn:"鸡肉"},
  {en:"noodles",cn:"面条"},{en:"soup",cn:"汤"},{en:"vegetable",cn:"蔬菜"},
  {en:"chopsticks",cn:"筷子"},{en:"bowl",cn:"碗"},{en:"spoon",cn:"勺子"},
  {en:"doctor",cn:"医生"},{en:"farmer",cn:"农民"},{en:"driver",cn:"司机"},
  {en:"nurse",cn:"护士"},{en:"people",cn:"人们"},{en:"baby brother",cn:"婴儿小弟弟"}
];
const HINTS = {classroom:"class + room 教室", schoolbag:"school + bag 书包", notebook:"note + book 笔记本",
  bedroom:"bed + room 卧室", bathroom:"bath + room 浴室", livingroom:"living room 客厅",
  chopsticks:"chop + sticks 筷子", vegetable:"ve-ge-ta-ble 蔬菜"};
let deck, qi, gem, lock, curWord, typed;
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }

function startGame(){
  deck = shuffle(WORDS).slice(0,5);           // 5个认识题
  const spell = shuffle(WORDS.filter(w=>!w.en.includes(" "))).slice(0,5); // 5个拼写题（不带空格的词）
  deck = shuffle([...deck.map(w=>({w,mode:"pick"})), ...spell.map(w=>({w,mode:"spell"}))]);
  qi=0; gem=0; lock=false;
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameCard').style.display='block';
  updateHUD();
  nextQ();
  say("嘎！坚忍烁号出发！先认气泡里的单词，再亲手把它拼出来！");
}
function updateHUD(){
  document.getElementById('gem').textContent=gem;
  document.getElementById('prog').textContent=qi;
}
function nextQ(){
  if(qi>=10){ endGame(); return; }
  lock=false;
  const item = deck[qi];
  document.getElementById('qTag').textContent = "🫧 打捞任务 "+(qi+1)+" · "+(item.mode==="pick"?"认一认":"拼一拼");
  if(item.mode==="pick"){
    document.getElementById('pickArea').style.display='block';
    document.getElementById('spellArea').style.display='none';
    document.getElementById('bigWord').textContent = item.w.en;
    const wrongs = shuffle(WORDS.filter(w=>w.cn!==item.w.cn)).slice(0,3).map(w=>w.cn);
    const opts = shuffle([item.w.cn, ...wrongs]);
    const box=document.getElementById('opts'); box.innerHTML='';
    opts.forEach(v=>{
      const d=document.createElement('div'); d.className='opt'; d.textContent=v;
      d.onclick=()=>answerPick(d,v,item.w); box.appendChild(d);
    });
  } else {
    curWord = item.w; typed=[];
    document.getElementById('pickArea').style.display='none';
    document.getElementById('spellArea').style.display='block';
    document.getElementById('bigCn').textContent = item.w.cn;
    buildSpell(item.w.en);
  }
  updateHUD();
}
function answerPick(el,v,w){
  if(lock) return; lock=true;
  if(v===w.cn){
    el.classList.add('correct'); gem++; say("咕噜咕噜——气泡捞上来啦！"+w.en+" 就是【"+w.cn+"】！+1气泡");
    setTimeout(()=>{ qi++; nextQ(); },1200);
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(e=>{ if(e.textContent===w.cn) e.classList.add('correct'); });
    say("嘎…捞到一只章鱼！"+w.en+" 是【"+w.cn+"】哦，记住它！");
    setTimeout(()=>{ qi++; nextQ(); },2000);
  }
  updateHUD();
}
function buildSpell(word){
  const clean = word.replace(/\s/g,'');
  // 字母池：单词字母 + 2个干扰字母
  let letters = clean.split('');
  const extra="abcdefghilmnoprstuw".split('');
  while(letters.length < clean.length+2){ const c=extra[Math.floor(Math.random()*extra.length)];
    if(letters.filter(x=>x===c).length < clean.split('').filter(x=>x===c).length+1) letters.push(c); }
  letters = shuffle(letters);
  const slots=document.getElementById('slots'), box=document.getElementById('letters');
  slots.innerHTML=''; box.innerHTML='';
  const target = word.split('');
  target.forEach((ch,i)=>{
    const s=document.createElement('div'); s.className='slot';
    if(ch===' '){ s.style.border='none'; s.innerHTML='&nbsp;'; s.dataset.space='1'; }
    slots.appendChild(s);
  });
  letters.forEach((c,idx)=>{
    const b=document.createElement('button'); b.className='lt'; b.textContent=c;
    b.onclick=()=>tapLetter(b,c); box.appendChild(b);
  });
}
function tapLetter(btn,c){
  if(lock) return;
  // 找到下一个未填槽位（跳过空格槽）
  const slots=[...document.querySelectorAll('.slot')];
  const s=slots.find(x=>!x.dataset.space && !x.classList.contains('filled'));
  if(!s) return;
  s.textContent=c; s.classList.add('filled'); s.dataset.char=c;
  btn.classList.add('used'); btn.dataset.slot=slots.indexOf(s);
  typed.push({btn,s});
  checkSpell();
}
function undoLetter(){
  const last=typed.pop(); if(!last) return;
  last.s.textContent=''; last.s.classList.remove('filled'); delete last.s.dataset.char;
  last.btn.classList.remove('used');
}
function revealWord(){
  if(lock) return; lock=true;
  document.getElementById('duckSay').textContent="嘎嘎，看好啦："+curWord.en+"（"+curWord.cn+"），跟着我读三遍！";
  // 自动演示填入
  const slots=[...document.querySelectorAll('.slot')].filter(x=>!x.dataset.space);
  const letters=[...curWord.en.replace(/\s/g,'')];
  slots.forEach((s,i)=>{ s.textContent=letters[i]; s.classList.add('filled'); });
  document.querySelectorAll('.lt').forEach(b=>b.classList.add('used'));
  setTimeout(()=>{ qi++; nextQ(); },2200);
}
function checkSpell(){
  const slots=[...document.querySelectorAll('.slot')].filter(x=>!x.dataset.space);
  if(slots.some(s=>!s.classList.contains('filled'))) return;
  const got=slots.map(s=>s.dataset.char).join('');
  const want=curWord.en.replace(/\s/g,'');
  if(got.toLowerCase()===want.toLowerCase()){
    lock=true; gem+=2; updateHUD();
    say("叮叮叮——拼写完美！【"+curWord.en+"】+2气泡！"+(HINTS[curWord.en.replace(/\s/g,'')]?"小窍门："+HINTS[curWord.en.replace(/\s/g,'')]:""));
    setTimeout(()=>{ qi++; nextQ(); },1600);
  } else {
    // 错了，闪红清空
    lock=true;
    slots.forEach(s=>s.style.color='#e05555');
    setTimeout(()=>{
      slots.forEach(s=>{ s.textContent=''; s.classList.remove('filled'); s.style.color=''; delete s.dataset.char; });
      document.querySelectorAll('.lt').forEach(b=>{ b.classList.remove('used'); delete b.dataset.slot; });
      typed=[];
      lock=false;
    },700);
    say("嘎…字母顺序不对哦！再看看，"+curWord.cn+"的单词是 "+want.length+" 个字母！");
  }
  updateHUD();
}
function say(t){ document.getElementById('duckSay').textContent=t; }
function endGame(){
  document.getElementById('gameCard').style.display='none';
  const s=document.getElementById('endScreen'); s.classList.add('active');
  if(gem>=12){ document.getElementById('endFace').textContent="🏆"; document.getElementById('endTitle').textContent="满载而归！"; }
  else if(gem>=7){ document.getElementById('endFace').textContent="🎉"; document.getElementById('endTitle').textContent="收获满满！"; }
  else { document.getElementById('endFace').textContent="💪"; document.getElementById('endTitle').textContent="继续练习！"; }
  document.getElementById('endDesc').innerHTML="本轮捞到：<b>"+gem+"</b> 个单词气泡 🫧<br>"+
    (gem>=12?"英语海洋冠军打捞队就是烁烁！":"多打捞几轮，单词就牢牢记住啦！");
}
</script>
