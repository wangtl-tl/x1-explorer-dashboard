<script>
// 错误自曝器：任何崩溃直接显示在嘎嘎对话框，方便截图报修
window.onerror=function(msg,src,line,col){
  try{
    var t="⚠️ 出错了："+msg+"（第"+line+"行）";
    var d=document.getElementById('duckSay'); if(d) d.textContent=t;
  }catch(e){}
};
// 安全存储：预览窗口/隐私模式下localStorage被禁也不崩
const LS=(()=>{try{window.localStorage.setItem("__t","1");window.localStorage.removeItem("__t");return window.localStorage;}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}})();
const LV_NAMES=["试商热身","整十邻近","四舍试商","五入试商","错算怪BOSS"];
const TOTAL_Q=10;
const SKINS=[{name:"经典坚忍烁号",face:"🦆",need:0},{name:"黄金嘎嘎号",face:"🐤",need:30},{name:"钢铁巨舰",face:"🦾",need:80}];
let qi,gem,combo,maxCombo,items,doubleArmed,cur,lock,bossTimer,bossLeft,curCat,adaptiveShift;
let stats=load("x1_stats_shishang",{sish:[0,0],wu:[0,0],near:[0,0]});   // [对,总]
let totalGems=+(LS.getItem("x1_total_gems")||0);
let skinSel=+(LS.getItem("x1_skin_shishang")||0);
let mistakes=JSON.parse(LS.getItem("x1_game_mistakes")||'{"shishang":[],"cuozi":[],"danci":[]}');

function load(k,d){ try{ return JSON.parse(LS.getItem(k))||d; }catch(e){ return d; } }
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function saveStats(){ LS.setItem("x1_stats_shishang",JSON.stringify(stats)); }
function saveMistakes(){ LS.setItem("x1_game_mistakes",JSON.stringify(mistakes)); }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800); }

/* ---------- 皮肤 ---------- */
function renderSkins(){
  const line=document.getElementById('skinLine'); line.innerHTML='';
  SKINS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='skin'+(i===skinSel?' sel':'')+(totalGems<s.need?' lock':'');
    d.innerHTML='<div>'+s.face+'</div><div class="skinname">'+(totalGems<s.need?'🔒'+s.need:'')+'</div>';
    d.onclick=()=>{ if(totalGems<s.need){ toast("还差 "+(s.need-totalGems)+" 颗宝石解锁 "+s.name); return; }
      skinSel=i; LS.setItem("x1_skin_shishang",i); renderSkins(); applySkin(); toast("已换上【"+s.name+"】！"); };
    line.appendChild(d);
  });
}
function applySkin(){
  const f=SKINS[skinSel].face;
  document.getElementById('duckFace').textContent=f;
  document.getElementById('duckFace2').textContent=f;
  document.getElementById('startFace').textContent="⚓"+f;
}

/* ---------- 每日变式注入 ---------- */
async function fetchCustom(){
  try{
    const r=await fetch("data.json?t="+Date.now());
    if(!r.ok) return [];
    const d=await r.json();
    const arr=(d.game_custom&&d.game_custom.shishang)||[];
    return arr.filter(q=>q&&q.b&&q.q).map(q=>({a:q.b*q.q+(q.r!=null?q.r:rnd(0,q.b-1)),b:q.b,q:q.q,r:q.r!=null?q.r:0,opts:null,custom:true}));
  }catch(e){ return []; }
}
function getRevenge(){
  return (mistakes.shishang||[]).slice(-3).map(m=>({a:m.a,b:m.b,q:m.q,r:m.r,opts:null,revenge:true}));
}

/* ---------- 出题 ---------- */
function catOf(b){ return b%10>=5?"wu":"sish"; }
function makeQ(level,diffShift){
  let lo=12,hi=29;
  if(level<=1){ lo=12; hi=29; }
  else if(level===2){ lo=21; hi=49; }
  else if(level===3){ lo=21; hi=44; }   // 四舍
  else if(level===4){ lo=25; hi=49; }   // 五入
  else { lo=31; hi=49; }
  lo=Math.max(11,lo-diffShift*3); hi=Math.min(99,hi+diffShift*4);
  let b,q,r,a,tries=0;
  do{
    b=rnd(lo,hi);
    if(level===3){ while(b%10>=5){ b=rnd(lo,hi); } }
    if(level===4){ while(b%10<5){ b=rnd(lo,hi); } }
    q=(level===5)?rnd(10,19):rnd(2,9);
    r=rnd(0,b-1); a=b*q+r; tries++;
  }while((a<200||a>999)&&tries<80);
  if(a<200||a>999){ b=rnd(31,49); q=rnd(6,9); r=rnd(0,b-1); a=b*q+r; }
  const wrongs=new Set();
  [q+1,q-1,q+2,q-2,q+10,q-10].forEach(c=>{ if(c>=1&&c!==q&&c<=99) wrongs.add(c); });
  return {a,b,q,r,opts:[q,...Array.from(wrongs).slice(0,3)].sort(()=>Math.random()-0.5),cat:catOf(b)};
}

/* ---------- 流程 ---------- */
function startGame(){
  qi=0; gem=0; combo=0; maxCombo=0; items={shield:1,double:0,skip:0}; doubleArmed=false; lock=false; adaptiveShift=0;
  renderSkins(); applySkin(); updateHUD(); renderItemBar();
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').style.display='block';
  document.getElementById('mistBox').style.display='none';
  const revenge=getRevenge();
  // 队列：复仇题最多2道先行，随机题在nextQ里补——先开局，特训题后台异步混入
  window.queue=[...revenge.slice(0,2)];
  say(revenge.length?"嘎！复仇题混进来了，船长小心！":"嘎！远征开始，稳住阵型！");
  nextQ();
  // X1特训题：不阻塞开局，加载到后替换尚未作答的队列槽位
  fetchCustom().then(cs=>{
    if(!cs.length) return;
    let j=qi+1, added=0;
    for(const c of cs){ if(j>=TOTAL_Q) break; window.queue[j]=c; j++; added++; }
    if(added) say("⭐ X1特训题混入本轮"+added+"道，打起精神！");
  }).catch(()=>{});
}
function nextQ(){
  if(qi>=TOTAL_Q){ endGame(); return; }
  lock=false; doubleArmed=false; renderItemBar();
  document.getElementById('hintBox').style.display='none';
  document.getElementById('bossBanner').style.display='none';
  clearInterval(bossTimer);
  const isBoss=(qi===4||qi===9);
  let q=window.queue[qi];
  if(!q){
    const lv=Math.min(5,Math.floor(qi/2)+1);
    q=makeQ(lv,adaptiveShift);
  }
  cur=q;
  const lv=Math.min(5,Math.floor(qi/2)+1);
  if(isBoss) startBoss(q);
  document.getElementById('lvTag').textContent=(q.revenge?"🔁 复仇题 · 第"+(qi+1)+"题":q.custom?"⭐ X1特训题 · 第"+(qi+1)+"题":"第 "+lv+" 关 · "+LV_NAMES[lv-1]+" · 第"+(qi+1)+"题");
  document.getElementById('lvFill').style.width=((qi+1)/TOTAL_Q*100)+"%";
  document.getElementById('qText').textContent=cur.a+" ÷ "+cur.b+" = ?";
  document.getElementById('qSub').textContent=isBoss?"BOSS战！限时抢答，答对+3宝石！":"商是多少？"+(doubleArmed?"✖️2已激活！":"");
  const box=document.getElementById('opts'); box.innerHTML='';
  cur.opts.forEach(v=>{
    const d=document.createElement('div'); d.className='opt'; d.textContent=v;
    d.onclick=()=>answer(d,v); box.appendChild(d);
  });
}
function startBoss(q){
  const b=document.getElementById('bossBanner'); b.style.display='block';
  b.firstChild.textContent="👹 错算怪BOSS（"+q.a+"÷"+q.b+"）！20秒内斩杀！";
  bossLeft=20;
  const fill=document.getElementById('bossFill');
  fill.style.width="100%";
  clearInterval(bossTimer);
  bossTimer=setInterval(()=>{
    bossLeft--; fill.style.width=(bossLeft/20*100)+"%";
    if(bossLeft<=0){ clearInterval(bossTimer);
      if(!lock){ lock=true; revealCorrect(); loseLife("⏰ 时间到！BOSS逃走了…商是 "+cur.q+" 哦！"); }
    }
  },1000);
  say("嘎嘎！BOSS来了！先算 "+cur.b+"×10 大概多少，再逼近！");
}
function answer(el,v){
  if(lock) return; lock=true; clearInterval(bossTimer);
  const isBoss=(qi===4||qi===9);
  const isOk=v===cur.q;
  const cat=cur.cat||"near";
  if(!stats[cat]) stats[cat]=[0,0];
  stats[cat][1]++; 
  if(isOk){
    el.classList.add('correct');
    stats[cat][0]++;
    combo++; maxCombo=Math.max(maxCombo,combo);
    let gain=(isBoss?3:1)+Math.floor(combo/3);
    const dbl=doubleArmed; if(doubleArmed){ gain*=2; doubleArmed=false; }
    gem+=gain;
    if(dbl) toast("✖️2翻倍到账！+"+gain+"宝石");
    if(combo>0&&combo%3===0){ grantItem(); }
    popCombo();
    say(pick(["嘎嘎嘎！斩！","商是"+cur.q+"，一击必中！","宝石+"+gain+"！","连击×"+combo+"，错算怪发抖了！"]));
    if(isBoss) toast("👹 BOSS被击败！+3宝石");
  } else {
    if(items.shield>0){ items.shield--; renderItemBar(); toast("🛡️ 护盾挡下一击！宝石没丢！");
      el.classList.add('wrong'); revealCorrect();
      say("好险！护盾替你挡了！记住商是 "+cur.q+"，用 "+cur.b+"×"+cur.q+" 检验！");
    } else {
      el.classList.add('wrong'); combo=0;
      // 错题入复仇名单
      mistakes.shishang=(mistakes.shishang||[]).filter(m=>!(m.a===cur.a&&m.b===cur.b));
      mistakes.shishang.push({a:cur.a,b:cur.b,q:cur.q,r:cur.r,ts:Date.now()});
      mistakes.shishang=mistakes.shishang.slice(-10); saveMistakes();
      if(mistakes.shishang.length>4) adaptiveShift=Math.min(2,adaptiveShift+1); else adaptiveShift=Math.max(0,adaptiveShift-1);
      loseLife("商是 "+cur.q+" 哦！"+cur.b+" × "+cur.q+" = "+(cur.b*cur.q)+"，加 "+cur.r+" 正好 "+cur.a+"。它进复仇名单了，下轮再见！");
    }
  }
  saveStats(); updateHUD();
  setTimeout(()=>{ qi++; nextQ(); },isOk?900:1900);
}
function loseLife(msg){
  say(msg); updateHUD();
}
function revealCorrect(){
  document.querySelectorAll('.opt').forEach(e=>{ if(+e.textContent===cur.q) e.classList.add('correct'); });
}
function grantItem(){
  const it=pick(["shield","skip","skip"]);
  items[it]=(items[it]||0)+1;
  if(items.shield>2) items.shield=2;
  renderItemBar();
  toast("🎁 连击奖励："+(it==="shield"?"护盾🛡️":it==="double"?"双倍宝石✖️2":"跳题卡⏭️"));
}
function renderItemBar(){
  const bar=document.getElementById('itemBar'); bar.innerHTML='';
  const defs=[["shield","🛡️ 护盾×"+(items.shield||0),"答错自动抵挡一次","shield"],
              ["double","✖️2 双倍宝石×"+(items.double||0),"点击激活，下一题翻倍","double"],
              ["skip","⏭️ 跳题卡×"+(items.skip||0),"点击跳过本题","skip"]];
  defs.forEach(([k,label,tip])=>{
    const d=document.createElement('div');
    const have=(items[k]||0)>0;
    d.className='item'+(!have?' none':'')+(doubleArmed&&k==='double'?' armed':'');
    d.textContent=label; d.title=tip;
    d.onclick=()=>{
      if(lock) return;
      if(k==='double'){ if(doubleArmed) return; doubleArmed=true; items.double--; toast("✖️2已激活，下一题答对翻倍！"); }
      if(k==='skip'){ items.skip--; toast("跳过！"+cur.a+"÷"+cur.b+"="+cur.q+" 记住它～"); lock=true; qi++; setTimeout(nextQ,400); }
      renderItemBar();
    };
    bar.appendChild(d);
  });
}
function showHint(){
  const b=cur.b, near=b%5<3?b-(b%10):b+(10-b%10);
  const box=document.getElementById('hintBox');
  box.textContent="🦆 把 "+b+" 看作 "+near+" 试商！试完用「除数×商」检验，余数要比除数小哦。";
  box.style.display='block';
}
function popCombo(){
  const c=document.getElementById('comboPop');
  if(combo>=3){ c.textContent="🔥 连击 ×"+combo+"！"; c.classList.remove('show'); void c.offsetWidth; c.classList.add('show'); }
}
function say(t){ document.getElementById('duckSay').textContent=t; }
function updateHUD(){ document.getElementById('gem').textContent=gem; document.getElementById('combo').textContent=combo; }

/* ---------- 结算 ---------- */
function endGame(){
  document.getElementById('gameScreen').style.display='none';
  const s=document.getElementById('endScreen'); s.classList.add('active');
  totalGems+=gem; LS.setItem("x1_total_gems",totalGems);
  let face,title;
  if(gem>=13){ face="🏆"; title="远征大捷！"; } else if(gem>=8){ face="🎉"; title="远征成功！"; } else { face="💪"; title="休整再战！"; }
  document.getElementById('endFace').textContent=face;
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endGem').textContent="💎".repeat(Math.min(gem,10))+(gem>10?" +"+(gem-10):"");
  document.getElementById('endDesc').innerHTML="本轮：<b>"+gem+"</b> 宝石 ｜ 最高连击 <b>×"+maxCombo+"</b> ｜ 累计 "+totalGems+" 宝石";
  // 雷达条
  const r=document.getElementById('radar');
  const rows=[["四舍试商",stats.sish],["五入试商",stats.wu],["整十邻近",stats.near]];
  r.innerHTML='<b style="font-size:13px">📊 试商能力图谱</b>'+rows.map(([n,v])=>{
    const p=v[1]?Math.round(v[0]/v[1]*100):0;
    return '<div class="row"><span style="width:64px">'+n+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span>'+v[0]+'/'+v[1]+'</span></div>';
  }).join("");
  const rev=(mistakes.shishang||[]).length;
  if(rev>0) toast("🔁 复仇名单里有 "+rev+" 道题等你收拾！");
  renderSkins();
}
function exportMistakes(){
  const m=mistakes.shishang||[];
  const box=document.getElementById('mistBox')||document.getElementById('mistBox2');
  const box2=document.getElementById('mistBox2');
  const target=box2||box;
  if(!m.length){ target.textContent="复仇名单空空如也，全对！嘎嘎佩服！"; target.style.display='block'; return; }
  const text="【试商复仇名单】\n"+m.map(x=>x.a+"÷"+x.b+"="+(x.a/x.b).toFixed(0)+"…").join("\n");
  target.textContent=text+"\n（长按复制或截图发群里给X1）";
  target.style.display='block';
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast("已复制，直接粘贴发群！")).catch(()=>{}); }
}
renderSkins(); applySkin();
</script>
</body>
</html>
