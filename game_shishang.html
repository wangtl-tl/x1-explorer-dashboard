<script>
const LV_NAMES = ["试商热身","整十邻近","四舍试商","五入试商","错算怪BOSS"];
const TOTAL = 10; // 每关10题？不，每关2题，5关共10题
const PER_LEVEL = 2;
let qIndex, gem, combo, maxCombo, cur, curLevel, hintUsed, lock;

function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

function makeQ(level){
  // 生成 a ÷ b = q ... r，聚焦试商：b两位数，q一位数（1-9，BOSS关允许两位商）
  let b, q, r, a, tries=0;
  do {
    if(level<=1){ b = rnd(12,29); }
    else if(level===2){ b = rnd(21,49); }
    else if(level===3){ b = rnd(21,49); q = rnd(3,7); } // 四舍：b个位1-4
    else if(level===4){ b = rnd(26,49); q = rnd(3,7); } // 五入：b个位5-9
    else { b = rnd(31,49); }
    if(level<=2){ q = rnd(2,9); }
    if(level===5){ q = rnd(10,19); }
    r = rnd(0,b-1);
    a = b*q + r;
    tries++;
  } while((a<200 || a>999) && tries<80);
  if(a<200||a>999){ b=rnd(31,49); q=rnd(6,9); r=rnd(0,b-1); a=b*q+r; }
  // 干扰项
  const wrongs = new Set();
  const cands = [q+1,q-1,q+2,q-2,q+10,q-10];
  for(const c of cands){ if(c>=1 && c!==q && c<=99) wrongs.add(c); if(wrongs.size>=3) break; }
  let arr = [q, ...Array.from(wrongs).slice(0,3)];
  arr.sort(()=>Math.random()-0.5);
  return {a,b,q,r,opts:arr};
}

function startGame(){
  qIndex=0; gem=0; combo=0; maxCombo=0; curLevel=1; hintUsed=false; lock=false;
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameScreen').style.display='block';
  nextQ();
  say("嘎！第一关出发！记住口诀：除数看作整十数，试商要乘一乘来检验！");
}

function nextQ(){
  if(qIndex >= 5*PER_LEVEL){ endGame(); return; }
  curLevel = Math.floor(qIndex/PER_LEVEL)+1;
  cur = makeQ(curLevel);
  hintUsed=false; lock=false;
  document.getElementById('lvTag').textContent = "第 "+curLevel+" 关 · "+LV_NAMES[curLevel-1]+"（第"+(qIndex%PER_LEVEL+1)+"/"+PER_LEVEL+"题）";
  document.getElementById('lvFill').style.width = (qIndex/(5*PER_LEVEL)*100)+"%";
  document.getElementById('qText').textContent = cur.a+" ÷ "+cur.b+" = ?";
  const box=document.getElementById('opts'); box.innerHTML='';
  cur.opts.forEach(v=>{
    const d=document.createElement('div'); d.className='opt'; d.textContent=v;
    d.onclick=()=>answer(d,v); box.appendChild(d);
  });
  document.getElementById('hintBox').style.display='none';
}

function answer(el,v){
  if(lock) return; lock=true;
  const isOk = v===cur.q;
  if(isOk){
    el.classList.add('correct');
    combo++; maxCombo=Math.max(maxCombo,combo);
    let gain = 1 + Math.floor(combo/3);
    gem += hintUsed ? Math.max(1,gain-1) : gain;
    popCombo();
    say(pick(["嘎嘎嘎！全对！错算怪被打飞啦！","厉害！这个商稳稳的！","宝石+1！烁烁是试商小船长！","哇，连击"+combo+"！错算怪吓哭了！"]));
    updateHUD();
    setTimeout(()=>{ qIndex++; nextQ(); },900);
  } else {
    el.classList.add('wrong');
    combo=0; updateHUD();
    revealCorrect();
    say("嘎…商是 "+cur.q+" 哦！用 "+cur.b+" × "+cur.q+" = "+(cur.b*cur.q)+" 检验一下，再加 "+cur.r+" 正好等于 "+cur.a+"！下一题加油！");
    updateHUD();
    setTimeout(()=>{ qIndex++; nextQ(); },1800);
  }
}

function revealCorrect(){
  document.querySelectorAll('.opt').forEach(e=>{
    if(+e.textContent===cur.q) e.classList.add('correct');
  });
}

function showHint(){
  if(hintUsed) return; hintUsed=true;
  const b=cur.b, near=b%5<3 ? b-(b%10) : b+(10-b%10);
  let tip = "把 "+b+" 看作整十数 "+near+" 来试商！试完再用 「除数 × 商」 检验，余数要比除数小哦。";
  const box=document.getElementById('hintBox');
  box.textContent="🦆 "+tip; box.style.display='block';
}

function popCombo(){
  const c=document.getElementById('comboPop');
  if(combo>=3){
    c.textContent="🔥 连击 ×"+combo+"！";
    c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
  }
}

function say(t){ document.getElementById('duckSay').textContent=t; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function updateHUD(){
  document.getElementById('gem').textContent=gem;
  document.getElementById('combo').textContent=combo;
}

function endGame(){
  document.getElementById('gameScreen').style.display='none';
  const s=document.getElementById('endScreen'); s.classList.add('active');
  const full=5*PER_LEVEL;
  let face,title;
  if(gem>=13){ face="🏆"; title="试商王者！"; }
  else if(gem>=8){ face="🎉"; title="闯关成功！"; }
  else { face="💪"; title="继续加油！"; }
  document.getElementById('endFace').textContent=face;
  document.getElementById('endTitle').textContent=title;
  document.getElementById('endGem').textContent="💎".repeat(Math.min(gem,10))+(gem>10?" +"+(gem-10):"");
  document.getElementById('endDesc').innerHTML=
    "本轮得分：<b>"+gem+"</b> 宝石<br>最高连击：<b>×"+maxCombo+"</b><br>"+
    (gem>=13?"错算怪被打跑啦，商的密林恢复光明！":"错算怪还在，下次用试商口诀收拾它！");
  let best=+(localStorage.getItem('x1_shishang_best')||0);
  if(gem>best){ best=gem; localStorage.setItem('x1_shishang_best',best); }
  document.getElementById('bestInfo').textContent="";
  say("");
}
function resetGame(){ startGame(); }
(function(){ let best=+(localStorage.getItem('x1_shishang_best')||0);
  if(best>0) document.getElementById('bestInfo').textContent="🏆 历史最高：["+best+"] 宝石"; })();
</script>
