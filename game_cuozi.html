const LS=(()=>{try{window.localStorage.setItem("__t","1");window.localStorage.removeItem("__t");return window.localStorage;}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v);},removeItem:k=>{delete m[k];}};}})();
const BANK = [
  {w:"卧室", bad:["屋室","卧市","卧式"], tip:"「卧」是睡的意思，别写成屋顶的「屋」！", cat:"课文字"},
  {w:"痕迹", bad:["狠迹","痕记","恨迹"], tip:"痕迹跟「狠心」「悔恨」都没关系，是病字旁的「痕」！", cat:"课文字"},
  {w:"均匀", bad:["钧匀","菌匀","均君"], tip:"均匀的「均」是土字旁，平衡的意思！", cat:"课文字"},
  {w:"遮蔽", bad:["遮敝","蔗蔽","遮弊"], tip:"「蔽」上面是草字头，像草一样盖住！", cat:"课文字"},
  {w:"倾斜", bad:["顷斜","清斜","倾谢"], tip:"是「倾向」的「倾」，不是公顷的「顷」！", cat:"课文字"},
  {w:"宽阔", bad:["宽扩","宽括","宽库"], tip:"宽阔用三点水的「阔」，跟宽阔的江面有关！", cat:"课文词"},
  {w:"沸腾", bad:["沸滕","拂腾","沸疼"], tip:"是「腾」不是「滕」！水烧开翻滚叫沸腾！", cat:"课文词"},
  {w:"横贯", bad:["横惯","横灌","横冠"], tip:"「贯」是穿过，横贯江面就是横着穿过去！", cat:"课文词"},
  {w:"恢复", bad:["灰复","恢腹","挥复"], tip:"恢复用「恢复」，不是灰色也不是肚子哦！", cat:"常用词"},
  {w:"蜗牛", bad:["涡牛","蜗午","瓜牛"], tip:"蜗牛是虫字旁的「蜗」，它背着壳慢慢爬！", cat:"课文字"},
  {w:"叶柄", bad:["叶病","叶丙","叶并"], tip:"「柄」是木字旁，连接叶子和茎的部分！", cat:"课文字"},
  {w:"慎重", bad:["镇重","真重","慎中"], tip:"「慎重」是竖心旁，认真小心的意思！", cat:"常用词"},
  {w:"陡峭", bad:["徒峭","陡俏","陡悄"], tip:"陡峭的山壁，用「陡」不是「徒」！", cat:"课文字"},
  {w:"堡垒", bad:["保垒","堡磊","宝垒"], tip:"堡垒下面是「土」，用土石筑成的！", cat:"课文词"},
  {w:"胸怀", bad:["凶怀","胸坏","胸杯"], tip:"胸怀的「胸」是月字旁，跟身体有关！", cat:"常用词"},
  {w:"训斥", bad:["训赤","驯斥","训翅"], tip:"训斥的「斥」，不是红色的赤！", cat:"常用词"},
  {w:"严厉", bad:["严历","严励","严禁"], tip:"严厉用「厉害」的「厉」，不是日历的「历」！", cat:"常用词"},
  {w:"屹立", bad:["屹力","乞立","屹例"], tip:"屹立像山一样站着不动，是山字旁的「屹」！", cat:"课文字"},
  {w:"花圃", bad:["花普","花埔","花铺"], tip:"「圃」是围着种花草的地方，全包围结构！", cat:"课文字"},
  {w:"霎时", bad:["需时","霞时","雬时"], tip:"「霎时」是一眨眼的工夫，雨字头的霎！", cat:"课文词"},
  {w:"顿时", bad:["吨时","盾时","钝时"], tip:"「顿时」是立刻的意思，页字旁的顿！", cat:"课文词"},
  {w:"逐渐", bad:["主渐","珠渐","遂渐"], tip:"逐渐是辶字旁的「逐」，一点点变化！", cat:"课文词"},
  {w:"犹如", bad:["尤其","优如","扰如"], tip:"「犹如」是好像的意思，别选成尤其是哦！", cat:"课文词"},
  {w:"柔和", bad:["揉和","蹂和","矛和"], tip:"柔和的「柔」下面是木字，软软的意思！", cat:"课文词"},
  {w:"鹅卵石", bad:["俄卵石","鹅伦石","鹅卯石"], tip:"卵是蛋的意思，鹅卵石就是像鹅蛋的石头！", cat:"课文词"},
  {w:"庄稼", bad:["庄嫁","桩稼","庄家"], tip:"庄稼是禾苗庄稼的稼，禾字旁！不是出嫁的嫁！", cat:"课文词"},
  {w:"蝙蝠", bad:["偏蝠","蝙幅","蝙福"], tip:"蝙蝠都是虫字旁，它是会飞的小兽！", cat:"课文字"},
  {w:"启示", bad:["启事","起示","启试"], tip:"「启示」是启发；寻物「启事」才是公告，别混了！", cat:"课文字"},
  {w:"空隙", bad:["空袭","空细","孔隙"], tip:"空隙是空出来的小缝，阝旁的隙！", cat:"课文字"},
  {w:"住宅", bad:["注宅","住它","驻宅"], tip:"住宅是住人的地方，别写成注意的注！", cat:"课文字"},
  {w:"隐蔽", bad:["隐敝","稳蔽","隐毙"], tip:"「隐蔽」是藏起来不让人看见，敝是破旧的敝！", cat:"课文字"},
  {w:"挖掘", bad:["挖倔","崛掘","挖绝"], tip:"挖掘用镢头的掘（扌旁），不是倔强的倔！", cat:"课文字"},
  {w:"宽敞", bad:["宽厂","宽敝","宽趟"], tip:"宽敞是宽敞明亮，里面有个厶！厂房的厂不够宽！", cat:"课文字"},

  {w:"血液", bad:["血夜","雪液","血腋"], tip:"血液的「液」是三点水，流淌的意思！不是黑夜的夜！", cat:"课文字"},
  {w:"茂盛", bad:["茂胜","贸盛","茂成"], tip:"茂盛是草木长得旺，不是胜利的胜！", cat:"课文词"},
  {w:"祖宗", bad:["组宗","租宗","祖棕"], tip:"祖宗的祖是示字旁，和祭祀有关！", cat:"课文字"},
  {w:"掩护", bad:["掩户","奄护","掩湖"], tip:"掩护是伸手护住，提手旁的掩！", cat:"课文字"},
  {w:"搏斗", bad:["博斗","膊斗","拔斗"], tip:"搏斗要用拳头，提手旁的搏！博物馆的博是广博！", cat:"课文字"},
  {w:"庞大", bad:["庞状","龙大","庞木"], tip:"庞大的庞外面是广字头，特别大的意思！", cat:"课文词"},
  {w:"欺负", bad:["欺付","期负","欺副"], tip:"欺负的负是辜负的负，别写成付出的付！", cat:"常用词"},
  {w:"无缘无故", bad:["无原无故","无元无固","无源无故"], tip:"无缘无故的「缘」是缘故的缘，绞丝旁！", cat:"课文词"},
  {w:"荒芜", bad:["慌芜","荒无","荒钨"], tip:"荒芜的土地没人种，草字头的芜！不是慌张的慌！", cat:"课文词"},
  {w:"干旱", bad:["韩旱","干早","干汗"], tip:"旱是日出在天上，日字底！比「早」多一竖！", cat:"课文字"},
  {w:"灌溉", bad:["灌概","罐溉","惯溉"], tip:"灌溉都是三点水，给田里浇水！概是大概的概！", cat:"课文字"},
  {w:"竞走", bad:["竟走","净走","靖走"], tip:"竞走的「竞」是比赛，立字头！竟然的竟里面多个日！", cat:"课文字"},
  {w:"旋转", bad:["弦转","玄转","旋专"], tip:"旋转的转是车字旁，车轮转起来！", cat:"课文词"},
  {w:"荣誉", bad:["誉荣","誊誉","萤誉"], tip:"荣誉是光荣的名誉，草字头的荣！", cat:"常用词"},
  {w:"清晰", bad:["清析","青晰","清皙"], tip:"清晰用日字旁的晰，看得清楚！", cat:"常用词"},
  {w:"抱负", bad:["抱副","报负","泡负"], tip:"抱负是心中的志向，拥抱的抱！", cat:"常用词"},
  {w:"角色", bad:["脚色","角式","角试"], tip:"角色是演员演的人物，不是脚！式是形式的式！", cat:"课文词"},
  {w:"舒服", bad:["输服","舒福","舒腹"], tip:"舒服的舒是舍字旁加予，身心舒展！", cat:"课文字"},
  {w:"弯曲", bad:["湾曲","蜿曲","弯屈"], tip:"弯曲的弯下面有个弓，像弯弓一样！", cat:"课文字"},
  {w:"蟋蟀", bad:["悉蟀","蟋摔","膝蟀"], tip:"蟋蟀都是虫字旁，两只小虫在打架！", cat:"课文字"},
  {w:"抛出", bad:["泡出","抱出","跑出"], tip:"抛出是提手旁，用手扔出去！", cat:"课文字"},
  {w:"熄灭", bad:["媳灭","息灭","熄蜜"], tip:"熄灭是火字旁的熄，火灭了！不是休息的息！", cat:"课文字"},
  {w:"溺水", bad:["弱水","溺入","溺没"], tip:"溺水是三点水的溺，跟水有关！不是弱小！", cat:"课文字"},
  {w:"衔来", bad:["街来","衍来","含来"], tip:"精卫衔来石子，衔字中间像含着一颗石子！不是街道的街！", cat:"课文字"},
  {w:"铁链", bad:["铁莲","铁连","铁涟"], tip:"铁链是金属的链，金字旁！不是莲花的莲！", cat:"课文字"},
  {w:"悲惨", bad:["悲掺","悲残","掺惨"], tip:"悲惨的惨是竖心旁，心里难过！", cat:"课文字"},
  {w:"火焰", bad:["火陷","火炎","夥焰"], tip:"火焰的焰是火字旁！陷阱的陷是阝旁，别混！", cat:"课文字"},
  {w:"饶恕", bad:["绕恕","饶怒","挠恕"], tip:"饶恕是饶了别人，食字旁的饶！不是绕圈！", cat:"课文字"},
  {w:"违抗", bad:["伟抗","围抗","违坑"], tip:"违抗的违是辶旁，违背着走！", cat:"课文字"},
  {w:"丑陋", bad:["丑漏","丑露","五陋"], tip:"丑陋的陋是阝旁，难看的意思！不是漏风的漏！", cat:"课文词"},
  {w:"窝囊", bad:["锅囊","窝馕","窝壤"], tip:"窝囊的囊笔画多要写紧凑！是『窝』不是铁锅的锅！", cat:"课文词"},
  {w:"崛起", bad:["倔起","掘起","崛兴"], tip:"中华崛起的崛是山字旁，像山一样立起来！", cat:"课文字"},
  {w:"严肃", bad:["严萧","严素","研肃"], tip:"严肃的肃要写紧凑，是庄严认真！不是萧条！", cat:"常用词"},
  {w:"轻盈", bad:["轻赢","清盈","轻嬴"], tip:"轻盈的盈是轻巧优美！输赢的赢是贝字底，别混！", cat:"课文词"},
  {w:"依赖", bad:["懒赖","顽赖","濑赖"], tip:"依赖就是靠着别人，别写成懒惰的懒！", cat:"课文词"},
  {w:"潜入", bad:["替入","浅入","潜人"], tip:"潜入是三点水的潜，悄悄钻进水里！", cat:"课文词"},
  {w:"风俗", bad:["凤俗","风浴","枫俗"], tip:"风俗的俗是单人旁，大家的风气习惯！", cat:"课文词"},
  {w:"人声鼎沸", bad:["人声顶沸","人声鼎拂","人声钉沸"], tip:"人声鼎沸的鼎是古代大锅，像锅里水开了一样吵！", cat:"课文词"},
  {w:"摇摇欲坠", bad:["摇摇欲堕","摇摇欲队","摇摇欲缀"], tip:"摇摇欲坠的坠是就要掉下来，土字底！", cat:"课文词"},
  {w:"理睬", bad:["理踩","理采","埋睬"], tip:"理睬的睬是目字旁，用眼理会！脚下踩是足字旁！", cat:"课文字"},
  {w:"骨髓", bad:["骨随","骨髄","膏髓"], tip:"骨髓在骨头里面！跟随的随是辶旁，别混！", cat:"课文字"},
  {w:"扁鹊", bad:["扁雀","篇鹊","编鹊"], tip:"神医扁鹊的名字是扁+鹊（喜鹊的鹊）！", cat:"课文字"},
  {w:"巫婆", bad:["诬婆","巫波","坞婆"], tip:"巫婆的巫是工字中间两个人！", cat:"课文字"},
  {w:"人烟稀少", bad:["人烟希少","人烟西少","人烟烯少"], tip:"人烟稀少的稀是禾字旁，庄稼稀疏！", cat:"课文词"},
  {w:"戎装", bad:["戒装","绒装","茸装"], tip:"王戎的戎是古代兵器，别写成戒备的戒！", cat:"课文字"},
  {w:"蓄须", bad:["畜须","储须","蕃须"], tip:"蓄须是留胡子，草字头的蓄！", cat:"课文词"},
  {w:"拒绝", bad:["拒决","距绝","巨绝"], tip:"拒绝的绝是绞丝旁，坚决不接受！不是距离！", cat:"常用词"}
];
const MONSTERS=[{name:"错字怪 · 爪爪",face:"👾"},{name:"错字怪 · 涂涂",face:"👹"},{name:"错字怪 BOSS · 白卷王",face:"👺"}];
const SKINS=[{name:"木弓",face:"🏹",need:0},{name:"猎星弩",face:"🎯",need:30},{name:"雷霆之弓",face:"⚡",need:80}];
let deck,qi,gem,hp,lock,items,doubleArmed,bossTimer,bossLeft;
let stats=load("x1_stats_cuozi",{});
let totalGems=+(LS.getItem("x1_total_gems")||0);
let skinSel=+(LS.getItem("x1_skin_cuozi")||0);
let mistakes=JSON.parse(LS.getItem("x1_game_mistakes")||'{"shishang":[],"cuozi":[],"danci":[]}');

function load(k,d){ try{ return JSON.parse(LS.getItem(k))||d; }catch(e){ return d; } }
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }
function saveStats(){ LS.setItem("x1_stats_cuozi",JSON.stringify(stats)); }
function saveMistakes(){ LS.setItem("x1_game_mistakes",JSON.stringify(mistakes)); }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.classList.remove('show'); void e.offsetWidth; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),1800); }

function renderSkins(){
  const line=document.getElementById('skinLine'); line.innerHTML='';
  SKINS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='skin'+(i===skinSel?' sel':'')+(totalGems<s.need?' lock':'');
    d.innerHTML='<div>'+s.face+'</div><div class="skinname">'+(totalGems<s.need?'🔒'+s.need:'')+'</div>';
    d.onclick=()=>{ if(totalGems<s.need){ toast("还差 "+(s.need-totalGems)+" 颗宝石解锁 "+s.name); return; }
      skinSel=i; LS.setItem("x1_skin_cuozi",i); renderSkins(); applySkin(); toast("装备【"+s.name+"】！狩猎去吧！"); };
    line.appendChild(d);
  });
}
function applySkin(){ document.getElementById('duckFace').textContent=SKINS[skinSel].face; }

async function fetchCustom(){
  try{
    const r=await fetch("data.json?t="+Date.now());
    if(!r.ok) return [];
    const d=await r.json();
    return ((d.game_custom&&d.game_custom.cuozi)||[]).filter(q=>q&&q.w);
  }catch(e){ return []; }
}
// 特训字补全器：只有词本身也能出题（自动生成干扰项），cat归到常用词保持图鉴映射
function normCustom(c){
  if(!c||!c.w) return null;
  const w=c.w;
  let bad=Array.isArray(c.bad)?c.bad.filter(b=>b&&b!==w):[];
  if(w.length>=2) bad.push(w[1]+w[0]+w.slice(2));
  if(w.length>=4) bad.push(w.slice(0,2)+w[3]+w[2]+w.slice(4));
  if(w.length>=3) bad.push(w[0]+w[2]+w[1]+w.slice(3));
  bad=[...new Set(bad)].filter(b=>b&&b!==w).slice(0,3);
  return {w,bad,tip:c.tip||"这是你作业里出现过的字词，嘎嘎帮你出成特训题啦！",cat:"常用词",custom:true};
}

function startGame(){
  qi=0; gem=0; lock=false; items={shield:1,double:0,skip:0}; doubleArmed=false;
  hp=10; renderItemBar();
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameZone').style.display='block';
  document.getElementById('gameCard').style.display='block';
  document.getElementById('mistBox').style.display='none';
  document.getElementById('gem').textContent=0;
  renderHP(); setMonster();
  const revengeWords=(mistakes.cuozi||[]).map(w=>BANK.find(b=>b.w===w)).filter(Boolean).slice(0,3).map(b=>({...b,revenge:true}));
  // 复仇字优先 + 随机补满10——先开局，特训字后台异步混入
  deck=[...revengeWords];
  const used=new Set(deck.map(q=>q.w));
  // 隔轮避重：优先出上一轮没出过的词，不够了才用旧词补
  let lastRound=[];
  try{ lastRound=JSON.parse(LS.getItem("x1_cuozi_last")||"[]"); }catch(e){}
  const fresh=shuffle(BANK.filter(b=>!used.has(b.w)&&!lastRound.includes(b.w)));
  const old=shuffle(BANK.filter(b=>!used.has(b.w)&&lastRound.includes(b.w)));
  deck=deck.concat(fresh,old).slice(0,10);
  LS.setItem("x1_cuozi_last",JSON.stringify(deck.map(q=>q.w)));
  nextQ();
  say(revengeWords.length?"嘎！上次逃掉的错字怪回来复仇了，这次一个不留！":"嘎！狩猎开始，看清每个字！");
  // X1特训字：不阻塞开局，加载到后插入尚未作答的普通题位
  fetchCustom().then(cs=>{
    if(!cs.length) return;
    let j=qi+1, added=0;
    for(const c of cs){
      while(j<deck.length&&(deck[j].revenge||deck[j].custom)) j++;
      if(j>=deck.length) break;
      const n=normCustom(c); if(n){ deck[j]=n; j++; added++; }
    }
    if(added) say("⭐ X1特训字混进来了"+added+"个，提高警惕！");
  }).catch(()=>{});
}
function setMonster(){
  const m=MONSTERS[Math.min(Math.floor((10-hp)/4),2)];
  document.getElementById('mName').textContent=m.name;
  document.getElementById('mFace').textContent=m.face;
}
function renderHP(){
  document.getElementById('hpFill').style.width=(hp/10*100)+"%";
  document.getElementById('hpNum').textContent="HP "+hp+"/10";
}
function nextQ(){
  if(qi>=10){ endGame(); return; }
  lock=false; renderItemBar();
  const q=deck[qi];
  const isBoss=(qi===4||qi===9);
  document.getElementById('prog').textContent="第 "+(qi+1)+" 箭 / 10";
  document.getElementById('qTag').textContent=q.revenge?"🔁 复仇狩猎":q.custom?"⭐ X1特训字":"普通狩猎"+(isBoss?" · BOSS":"");
  document.getElementById('qTip').innerHTML="哪个写法是<b>正确</b>的？"+(isBoss?' <span style="color:#e0559a">限时20秒！</span>':"");
  const opts=shuffle([q.w,...q.bad]);
  const box=document.getElementById('opts'); box.innerHTML='';
  opts.forEach(v=>{
    const d=document.createElement('div'); d.className='opt'; d.textContent=v;
    d.onclick=()=>answer(d,v,q,isBoss); box.appendChild(d);
  });
  clearInterval(bossTimer);
  if(isBoss){
    bossLeft=20;
    const oldFill=document.getElementById('bossFillBox'); if(oldFill) oldFill.remove();
    const fill=document.createElement('div'); fill.className='bosstimer'; fill.id='bossFillBox';
    fill.innerHTML='<i id="bossFill"></i>';
    document.getElementById('mName').after(fill);
    bossTimer=setInterval(()=>{
      bossLeft--; const b=document.getElementById('bossFill');
      if(b) b.style.width=(bossLeft/20*100)+"%";
      if(bossLeft<=0){ clearInterval(bossTimer); if(!lock){ lock=true; answerMiss(q); } }
    },1000);
  }
}
function answer(el,v,q,isBoss){
  if(lock) return; lock=true; clearInterval(bossTimer);
  const cat=q.cat||"其他";
  if(!stats[cat]) stats[cat]=[0,0];
  stats[cat][1]++;
  if(v===q.w){
    el.classList.add('correct');
    stats[cat][0]++; saveStats();
    if(window.XP3)XP3.hit('cuozi',cat,isBoss);
    // 复仇成功：答对就把这个字移出复仇名单
    mistakes.cuozi=(mistakes.cuozi||[]).filter(x=>x!==q.w); saveMistakes();
    hp--; renderHP(); setMonster();
    const f=document.getElementById('mFace'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit');
    let gain=(isBoss?3:1); const dbl=doubleArmed; if(doubleArmed){ gain*=2; doubleArmed=false; }
    gem+=gain; document.getElementById('gem').textContent=gem;
    // 连击道具（按命中数）
    if((10-hp)%3===0) grantItem();
    say("咻——正中！"+q.tip+(isBoss?" BOSS狩猎成功！+3宝石！":"")+(dbl?" ✖️2翻倍到账！":""));
    if(hp<=0){ setTimeout(endGame,1000); return; }
    setTimeout(()=>{ qi++; nextQ(); },isBoss?1600:1300);
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(e=>{ if(e.textContent===q.w) e.classList.add('correct'); });
    if(items.shield>0){ items.shield--; renderItemBar(); toast("🛡️ 护盾挡下！HP没掉！"); }
    else { hp--; renderHP(); if(window.XP3)XP3.miss('cuozi',cat); }
    // 错字复仇名单
    mistakes.cuozi=(mistakes.cuozi||[]).filter(w=>w!==q.w);
    mistakes.cuozi.push(q.w); mistakes.cuozi=mistakes.cuozi.slice(-12); saveMistakes();
    saveStats();
    say("嘎…正确写法是【"+q.w+"】。"+q.tip+" 它已加入复仇名单！"+(isBoss?"（BOSS限时未中，商..哦不，字是【"+q.w+"】）":""));
    setTimeout(()=>{ qi++; nextQ(); },2000);
  }
  updateShots();
}
function answerMiss(q){
  if(window.XP3)XP3.miss('cuozi',q.cat||"其他");
  say("⏰ 超时啦！正确写法是【"+q.w+"】。"+q.tip);
  document.querySelectorAll('.opt').forEach(e=>{ if(e.textContent===q.w) e.classList.add('correct'); });
  mistakes.cuozi=(mistakes.cuozi||[]).filter(w=>w!==q.w);
  mistakes.cuozi.push(q.w); mistakes.cuozi=mistakes.cuozi.slice(-12); saveMistakes();
  setTimeout(()=>{ qi++; nextQ(); },2000);
}
function grantItem(){
  const it=Math.random()<0.4?"shield":"skip";
  items[it]=(items[it]||0)+1; if(items.shield>2) items.shield=2;
  renderItemBar();
  toast("🎁 狩猎奖励："+(it==="shield"?"护盾🛡️":"跳题卡⏭️"));
}
function renderItemBar(){
  const bar=document.getElementById('itemBar'); bar.innerHTML='';
  const defs=[["shield","🛡️ 护盾×"+(items.shield||0),"答错不掉血"],
              ["double","✖️2 双倍宝石×"+(items.double||0),"下一箭得分翻倍"],
              ["skip","⏭️ 跳题卡×"+(items.skip||0),"放走这只怪"]];
  defs.forEach(([k,label,tip])=>{
    const d=document.createElement('div');
    const have=(items[k]||0)>0;
    d.className='item'+(!have?' none':'');
    d.textContent=label; d.title=tip;
    d.onclick=()=>{
      if(lock) return;
      const q=deck[qi];
      if(k==='double'){ if(doubleArmed) return; doubleArmed=true; items.double--; toast("✖️2已激活！"); }
      if(k==='skip'){ items.skip--; toast("放走了【"+q.w+"】，它还会再来的～"); lock=true; qi++; setTimeout(nextQ,400); }
      renderItemBar();
    };
    bar.appendChild(d);
  });
}
function updateShots(){ document.getElementById('shots').textContent=Math.max(0,10-qi-1); }
function say(t){ document.getElementById('duckSay').textContent=t; }

function endGame(){
  clearInterval(bossTimer);
  document.getElementById('gameZone').style.display='none';
  document.getElementById('gameCard').style.display='none';
  const s=document.getElementById('endScreen'); s.classList.add('active');
  totalGems+=gem; LS.setItem("x1_total_gems",totalGems);
  const face=document.getElementById('endFace'), title=document.getElementById('endTitle');
  if(hp<=0){ face.textContent="🏆"; title.textContent="错字怪被消灭啦！"; }
  else { face.textContent="💪"; title.textContent="错字怪逃跑了…"; }
  document.getElementById('endDesc').innerHTML=
    "本轮：<b>"+gem+"</b> 宝石 ｜ 命中 <b>"+(10-hp)+"</b>/10 箭 ｜ 累计 "+totalGems+" 宝石"+
    (hp<=0?"<br>语文森林恢复安全！⭐⭐⭐":"<br>复仇名单已更新，下次必中！");
  // 分类图谱
  const r=document.getElementById('radar');
  const rows=Object.entries(stats).filter(([k,v])=>v[1]>0);
  r.innerHTML='<b style="font-size:13px">📊 狩猎图谱（累计）</b>'+(rows.length?rows.map(([n,v])=>{
    const p=Math.round(v[0]/v[1]*100);
    return '<div class="row"><span style="width:64px">'+n+'</span><div class="bar"><i style="width:'+p+'%"></i></div><span>'+v[0]+'/'+v[1]+'</span></div>';
  }).join(""):'<div class="row">本轮暂无数据</div>');
  renderSkins();
  if(window.XP3)XP3.settle({game:'cuozi',name:'错字怪猎人',gems:gem});
}
function exportMistakes(){
  const m=mistakes.cuozi||[];
  const target=document.getElementById('mistBox2')||document.getElementById('mistBox');
  if(!m.length){ target.textContent="复仇名单空空如也，全对！嘎嘎佩服！"; target.style.display='block'; return; }
  const text="【错字复仇名单】\n"+m.join("、");
  target.textContent=text+"\n（长按复制或截图发群里给X1）";
  target.style.display='block';
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast("已复制！")).catch(()=>{}); }
}
renderSkins(); applySkin();
</script>
</body>
</html>
