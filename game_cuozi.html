<script>
const BANK = [
  {w:"卧室", bad:["屋室","卧市","卧式"], tip:"「卧」是睡的意思，别写成屋顶的「屋」！"},
  {w:"痕迹", bad:["狠迹","痕记","恨迹"], tip:"痕迹跟「狠心」「悔恨」都没关系，是病字旁的「痕」！"},
  {w:"均匀", bad:["钧匀","菌匀","均君"], tip:"均匀的「均」是土字旁，平衡的意思！"},
  {w:"遮蔽", bad:["遮敝","蔗蔽","遮弊"], tip:"「蔽」上面是草字头，像草一样盖住！"},
  {w:"倾斜", bad:["顷斜","清斜","倾谢"], tip:"是「倾向」的「倾」，不是公顷的「顷」！"},
  {w:"宽阔", bad:["宽扩","宽括","宽库"], tip:"宽阔用三点水的「阔」，跟宽阔的江面有关！"},
  {w:"沸腾", bad:["沸滕","拂腾","沸疼"], tip:"是「腾」不是「滕」！水烧开翻滚叫沸腾！"},
  {w:"横贯", bad:["横惯","横灌","横冠"], tip:"「贯」是穿过，横贯江面就是横着穿过去！"},
  {w:"恢复", bad:["灰复","恢腹","挥复"], tip:"恢复用「恢复」，不是灰色也不是肚子哦！"},
  {w:"蜗牛", bad:["涡牛","蜗午","瓜牛"], tip:"蜗牛是虫字旁的「蜗」，它背着壳慢慢爬！"},
  {w:"叶柄", bad:["叶病","叶丙","叶并"], tip:"「柄」是木字旁，连接叶子和茎的部分！"},
  {w:"慎重", bad:["镇重","真重","慎中"], tip:"「慎重」是竖心旁，认真小心的意思！"},
  {w:"陡峭", bad:["徒峭","陡俏","陡悄"], tip:"陡峭的山壁，用「陡」不是「徒」！"},
  {w:"堡垒", bad:["保垒","堡磊","宝垒"], tip:"堡垒下面是「土」，用土石筑成的！"},
  {w:"胸怀", bad:["凶怀","胸坏","胸杯"], tip:"胸怀的「胸」是月字旁，跟身体有关！"},
  {w:"训斥", bad:["训赤","驯斥","训翅"], tip:"训斥的「斥」，不是红色的赤！"},
  {w:"严厉", bad:["严历","严励","严禁"], tip:"严厉用「厉害」的「厉」，不是日历的「历」！"},
  {w:"屹立", bad:["屹力","乞立","屹例"], tip:"屹立像山一样站着不动，是山字旁的「屹」！"},
  {w:"花圃", bad:["花普","花埔","花铺"], tip:"「圃」是围着种花草的地方，全包围结构！"},
  {w:"霎时", bad:["需时","霞时","雬时"], tip:"「霎时」是一眨眼的工夫，雨字头的霎！"}
];
const MONSTERS = [
  {name:"错字怪 · 爪爪", face:"👾"},
  {name:"错字怪 · 涂涂", face:"👹"},
  {name:"错字怪 BOSS · 白卷王", face:"👺"}
];
let deck, qi, gem, hp, lock;
function shuffle(a){ return a.slice().sort(()=>Math.random()-0.5); }

function startGame(){
  deck = shuffle(BANK).slice(0,10);
  qi=0; gem=0; lock=false;
  hp = 10;
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('endScreen').classList.remove('active');
  document.getElementById('gameZone').style.display='block';
  document.getElementById('gameCard').style.display='block';
  setMonster();
  renderHP();
  nextQ();
  say("嘎嘎！错字怪出现啦！选出正确的写法射它一箭！");
}
function setMonster(){
  const m = MONSTERS[Math.min(Math.floor((10-hp)/4),2)];
  document.getElementById('mName').textContent = m.name;
  document.getElementById('mFace').textContent = m.face;
}
function renderHP(){
  document.getElementById('hpFill').style.width = (hp/10*100)+"%";
  document.getElementById('hpNum').textContent = "HP "+hp+"/10";
}
function nextQ(){
  if(qi>=10){ endGame(); return; }
  lock=false;
  const q = deck[qi];
  document.getElementById('prog').textContent = "第 "+(qi+1)+" 箭 / 10";
  document.getElementById('qTip').innerHTML = "哪个写法是<b>正确</b>的？";
  const opts = shuffle([q.w, ...q.bad]);
  const box=document.getElementById('opts'); box.innerHTML='';
  opts.forEach(v=>{
    const d=document.createElement('div'); d.className='opt'; d.textContent=v;
    d.onclick=()=>answer(d,v,q); box.appendChild(d);
  });
}
function answer(el,v,q){
  if(lock) return; lock=true;
  if(v===q.w){
    el.classList.add('correct');
    hp--; renderHP(); setMonster();
    const f=document.getElementById('mFace'); f.classList.remove('hit'); void f.offsetWidth; f.classList.add('hit');
    gem += (hp===5?2:1); // 打到半血奖励双倍
    document.getElementById('gem').textContent=gem;
    say("咻——射中了！"+q.tip+(hp===5?" 错字怪暴怒换形态，宝石翻倍！":""));
    if(hp<=0){ setTimeout(endGame,1000); return; }
    setTimeout(()=>{ qi++; nextQ(); },1400);
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.opt').forEach(e=>{ if(e.textContent===q.w) e.classList.add('correct'); });
    say("嘎…射偏了！正确写法是【"+q.w+"】。"+q.tip+" 错字怪在偷笑！");
    setTimeout(()=>{ qi++; nextQ(); },2000);
  }
}
function say(t){ document.getElementById('duckSay').textContent=t; }
function endGame(){
  document.getElementById('gameZone').style.display='none';
  document.getElementById('gameCard').style.display='none';
  const s=document.getElementById('endScreen'); s.classList.add('active');
  const face = document.getElementById('endFace');
  const title = document.getElementById('endTitle');
  if(hp<=0){ face.textContent="🏆"; title.textContent="错字怪被消灭啦！"; }
  else { face.textContent="💪"; title.textContent="错字怪逃跑了…"; }
  document.getElementById('endDesc').innerHTML=
    "本轮得分：<b>"+gem+"</b> 宝石<br>命中：<b>"+(10-hp)+"</b> / 10 箭<br>"+
    (hp<=0?"语文森林恢复安全，嘎嘎送你三颗星星！⭐⭐⭐":"记住刚才写错的字，再来一箭把它拿下！");
}
</script>
